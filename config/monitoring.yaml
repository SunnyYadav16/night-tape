    method: http
    url: https://www.nasdaqtrader.com/TraderNews.aspx?id=ETA2026-46

  # weekly §1.3 — OCEA.MEMOIR dataset page and schemas the pilot depends on.
  - source_id: databento-ocea-memoir
    source_class: VENDOR_DOC
    method: render
