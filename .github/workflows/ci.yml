name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.12"
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: make test
