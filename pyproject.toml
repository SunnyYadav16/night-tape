[project]
name = "night-tape"
version = "0.1.0"
description = "Preregistered measurement of US overnight execution quality on BOATS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "databento==0.87.0",
    "httpx>=0.28.1",
    "jsonschema[format-nongpl]>=4.26.0",
    "playwright>=1.63.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
night-tape = "night_tape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/night_tape"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs/", "config/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]
