    notes: "Not FAQ-only: stated in the filing itself (Item 4(a) and Item 21), e.g. 'for a trading session that operates from 8:00 p.m. ET Sunday through 4:00 a.m. ET Monday, trades effected during that trading session are reported by 4:15 a.m. ET Monday'."
  - claim_id: C-BOATS-OPERATING-DAYS
    claim_text: "BOATS operates only on days when the NYSE TRF is open the following morning; trades settle T+1."
    claim_type: schedule
    load_bearing: true
    affects: [session_logic, date_logic]
    status: REFUTED
    source_class: SEC_FORM_ATS_N
    source_id: boats-atsn-2026-current-view
    notes: "PARTIAL CONTRADICTION. The TRF-availability half is confirmed by Item 4(a): 'BOATS operating session is overnight from 8:00 p.m. ET to 4:00 a.m. ET, dependent on the availability of the NYSE Trade Reporting Facility (TRF) to report trades the following trading day' (with the Friday/Saturday and Christmas examples). But Item 22 (Clearance and Settlement) directly contradicts the T+1 half: 'Settlement of trades executed on the ATS occurs through the Continuous Net Settlement (CNS) system operated by DTC and generally settle on the second day after the trade' -- that is T+2, not T+1. Marking the whole compound claim REFUTED because one of its two assertions is contradicted by the primary source; the claim likely needs to be split so the verified TRF-days assertion isn't dragged down by the settlement-cycle error. Flagged prominently in the report -- this has four-date/nscc_clearing_business_date implications."
